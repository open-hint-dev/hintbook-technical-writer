name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.15.0
      - name: Check tag and version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: test "${REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm test
      - name: Publish if absent
        run: npm view @openhint/hintbook-technical-writer@$(node -p "require('./package.json').version") version >/dev/null 2>&1 || npm publish --access public
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
